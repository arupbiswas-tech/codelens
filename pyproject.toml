[project]
name = "codelens"
version = "0.1.0"
description = "Codebase Q&A and PR reviewer built on RAG (FastAPI + pgvector + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastembed>=0.4",
    "openai>=1.50",
    "langgraph>=1.0",
    "unidiff>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.16",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # lets tests import scripts/post_review.py

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
